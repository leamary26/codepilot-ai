
# Test application configuration
spring.application.name=codepilot-ai-test

# Temporary H2 database
spring.datasource.url=jdbc:h2:mem:codepilot_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Dummy Gemini configuration for testing
gemini.api.key=test-api-key
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-3.1-flash-lite
gemini.fallback.model=gemini-3.5-flash-lite

# Test-only JWT configuration
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtMzItYnl0ZXMhISE=
jwt.expiration=86400000
